name: Generate static site

on:
  push:
    branches: [main]
    paths:
      - '.sitegen/**'
      - '.github/workflows/generate-site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate complete site
        run: python .sitegen/run_generator.py

      - name: Commit generated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Generate complete Opera-print site [skip ci]"
            git push
          fi
