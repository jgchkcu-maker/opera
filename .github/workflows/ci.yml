name: Static UI checks

on:
  push:
    branches: ["customer-first-redesign", "main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate curated site
        run: python build_site.py
      - name: Run core regression suite
        run: python -m unittest tests.test_site -v
      - name: Run builder polish regressions
        run: python -m unittest tests.test_builder_professional -v
      - name: Run smart ordering contract
        run: python -m unittest tests.test_smart_ordering -v
      - name: Run iOS 26 design contract
        run: python -m unittest tests.test_ios26_design -v
