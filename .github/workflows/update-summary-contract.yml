name: Update summary contract

on:
  push:
    branches: ["fix-builder-summary-panel"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-builder-summary-panel
      - name: Update stale copy assertion
        run: python -c "from pathlib import Path; p=Path('tests/test_site.py'); s=p.read_text(encoding='utf-8'); old='self.assertIn(\"Пройдите 4 шага\", ux)'; new='self.assertIn(\"Продолжите заполнение\", ux)'; assert old in s; p.write_text(s.replace(old,new,1),encoding='utf-8')"
      - name: Commit contract update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_site.py
          git commit -m "test: align locked summary copy with revised UX"
          git push origin HEAD:fix-builder-summary-panel
